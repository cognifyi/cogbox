[project]
name = "cogbox-verl-retool"
version = "0.1.0"
description = "Companion files for benchmarking veRL ReTool backends with Cogbox"
authors = [{name = "Cogbox Team", email = "support@pazity.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cogbox>=0.128.1,<1.0.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
