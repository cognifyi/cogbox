# Base (non-secret) values for the cogboxdev test deployment on k3s.
# Secrets are created out-of-band (see README) and referenced via existingSecret.
domain: cogboxdev.pazity.com

api:
  replicaCount: 1
  pdb: {enabled: false}
  hpa: {enabled: false}
  ingress:
    enabled: true
    className: nginx
    host: cogboxdev.pazity.com
    tlsSecret: cogboxdev-api-tls
    annotations:
      cert-manager.io/cluster-issuer: wildcard-dns01
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 2000m, memory: 4Gi }

migration:
  enabled: true

db:
  host: postgres
  port: 5432
  database: cogbox
  username: cogbox
  tlsEnabled: false
  tlsRejectUnauthorized: false

redis:
  host: redis
  port: 6379

oidc:
  clientId: cogbox
  issuerBaseUrl: https://keycloak.cogboxdev.pazity.com/realms/cogbox
  publicDomain: https://keycloak.cogboxdev.pazity.com/realms/cogbox
  audience: cogbox

s3:
  endpoint: http://rustfs:9000
  stsEndpoint: http://rustfs:9000
  region: us-east-1
  defaultBucket: cogbox

dashboard:
  url: https://cogboxdev.pazity.com/dashboard
  baseApiUrl: https://cogboxdev.pazity.com

proxyDefaults:
  protocol: https
  domain: proxy.cogboxdev.pazity.com

defaultSnapshot: cognifyi/sandbox:latest-slim

registry:
  transient:
    url: http://registry:6000
    admin: admin
    projectId: cogbox
  internal:
    url: http://registry:6000
    admin: admin
    projectId: cogbox

quotas:
  defaultRegionId: dev
  defaultRegionName: dev
  enforceQuotas: false
  # Dev track: new orgs can request up to one 4C/12G/100G sandbox
  # (single 14G box). Per-sandbox gates enforce these even with
  # enforceQuotas=false; existing org rows need a manual UPDATE.
  maxMemoryPerSandbox: 12
  maxDiskPerSandbox: 100

featureFlags:
  forceEnabled: organization_infrastructure

secrets:
  useExternalSecrets: false
  existingSecret: cogbox-dev-secrets
