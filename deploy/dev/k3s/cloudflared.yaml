# cloudflared running INSIDE the cluster (same topology as production):
# full cluster DNS, TLS terminated at Cloudflare edge.
# Secrets (tunnel credentials JSON) are created out-of-band, see README.
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare
spec:
  replicas: 1
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0
          args: ["tunnel", "--config", "/etc/cloudflared/config.yaml", "--metrics", "0.0.0.0:2000", "--protocol", "http2", "run"]
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - { name: config, mountPath: /etc/cloudflared }
      volumes:
        - name: config
          secret:
            secretName: cloudflared-tunnel
            items:
              - { key: config.yaml, path: config.yaml }
              - { key: creds.json, path: creds.json }
