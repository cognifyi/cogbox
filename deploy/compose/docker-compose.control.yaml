# Production control-plane Compose (pilot / single-VM(-ha) stage).
# Runs ONLY the shared control plane: API (+Dashboard), Postgres, Redis,
# registry, S3. Regions (proxy/runner/snapshot/ssh) join remotely — on
# Kubernetes (deploy/helm/cogbox-region) or plain VMs (BYOC guide).
#
# Differences from docker/docker-compose.yaml (evaluation):
# - No Dex / MailDev / PgAdmin / Jaeger-all-in-one. Identity is an EXTERNAL
#   OIDC issuer (Keycloak/Auth0/Entra/Okta/Google) — see OIDC_* below.
# - Every secret comes from the .env file (deploy/compose/.env.example).
#   The stack REFUSES to boot with placeholder defaults (see `envcheck`).
# - Postgres/Redis persist on named volumes + healthchecks; API waits on them.
# - Resource limits set; restart policies explicit; version pins via $IMAGE_TAG.
#
# Usage:
#   cp deploy/compose/.env.example deploy/compose/.env   # fill in for real
#   docker compose -f deploy/compose/docker-compose.control.yaml --env-file deploy/compose/.env up -d
#   docker compose -f deploy/compose/docker-compose.control.yaml --env-file deploy/compose/.env \
#     run --rm api yarn migration:run:init
#   docker compose -f deploy/compose/docker-compose.control.yaml --env-file deploy/compose/.env \
#     run --rm api yarn migration:run:pre-deploy

name: cogbox-control

services:
  envcheck:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        for v in ENCRYPTION_KEY ENCRYPTION_SALT DB_PASSWORD REDIS_PASSWORD S3_ACCESS_KEY S3_SECRET_KEY; do
          val="$(printenv "$v")"
          case "$val" in
            ""|changeme*|supersecret*|secret_api_token|super_secret_key|minioadmin)
              echo "FATAL: $v is empty or still a placeholder. Fill deploy/compose/.env first." >&2
              exit 1 ;;
          esac
        done
        echo "secret check passed"
    env_file:
      - path: ${ENV_FILE:-deploy/compose/.env}
        required: true

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-cogbox}
    volumes:
      - db_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: 4G }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  registry:
    image: registry:2.8.2
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:6000
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry:/var/lib/registry
    restart: unless-stopped

  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3_data:/data
    command: /data
    restart: unless-stopped

  api:
    image: cognifyi/cogbox-api:${IMAGE_TAG:-0.190.3}
    depends_on:
      envcheck:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      RUN_MIGRATIONS: "false"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?set ENCRYPTION_SALT}
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-cogbox}
      DB_TLS_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OIDC_ISSUER_BASE_URL: ${OIDC_ISSUER_BASE_URL:?set OIDC_ISSUER_BASE_URL}
      PUBLIC_OIDC_DOMAIN: ${OIDC_ISSUER_BASE_URL:?set OIDC_ISSUER_BASE_URL}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?set OIDC_AUDIENCE}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_MANAGEMENT_API_ENABLED: ${OIDC_MANAGEMENT_API_ENABLED:-}
      OIDC_MANAGEMENT_API_CLIENT_ID: ${OIDC_MANAGEMENT_API_CLIENT_ID:-}
      OIDC_MANAGEMENT_API_CLIENT_SECRET: ${OIDC_MANAGEMENT_API_CLIENT_SECRET:-}
      OIDC_MANAGEMENT_API_AUDIENCE: ${OIDC_MANAGEMENT_API_AUDIENCE:-}
      DASHBOARD_URL: ${DASHBOARD_URL:?set DASHBOARD_URL}
      DASHBOARD_BASE_API_URL: ${DASHBOARD_BASE_API_URL:?set DASHBOARD_BASE_API_URL}
      S3_ENDPOINT: http://s3:9000
      S3_STS_ENDPOINT: http://s3:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_DEFAULT_BUCKET: ${S3_DEFAULT_BUCKET:-cogbox}
      TRANSIENT_REGISTRY_URL: ${TRANSIENT_REGISTRY_URL:?set TRANSIENT_REGISTRY_URL}
      TRANSIENT_REGISTRY_ADMIN: ${TRANSIENT_REGISTRY_ADMIN:-admin}
      TRANSIENT_REGISTRY_PASSWORD: ${TRANSIENT_REGISTRY_PASSWORD:?set TRANSIENT_REGISTRY_PASSWORD}
      TRANSIENT_REGISTRY_PROJECT_ID: ${TRANSIENT_REGISTRY_PROJECT_ID:-cogbox}
      INTERNAL_REGISTRY_URL: ${INTERNAL_REGISTRY_URL:?set INTERNAL_REGISTRY_URL}
      INTERNAL_REGISTRY_ADMIN: ${INTERNAL_REGISTRY_ADMIN:-admin}
      INTERNAL_REGISTRY_PASSWORD: ${INTERNAL_REGISTRY_PASSWORD:?set INTERNAL_REGISTRY_PASSWORD}
      INTERNAL_REGISTRY_PROJECT_ID: ${INTERNAL_REGISTRY_PROJECT_ID:-cogbox}
      PROXY_API_KEY: ${PROXY_API_KEY:?set PROXY_API_KEY}
      SSH_GATEWAY_API_KEY: ${SSH_GATEWAY_API_KEY:?set SSH_GATEWAY_API_KEY}
      PROXY_DOMAIN: ${PROXY_DOMAIN:-proxy.example.com}
      PROXY_TEMPLATE_URL: ${PROXY_TEMPLATE_URL:?set PROXY_TEMPLATE_URL}
      DEFAULT_SNAPSHOT: ${DEFAULT_SNAPSHOT:-cognifyi/sandbox:latest-slim}
      OPENFEATURE_FORCE_ENABLED_FLAGS: ${OPENFEATURE_FORCE_ENABLED_FLAGS:-organization_infrastructure}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_EMAIL_FROM: ${SMTP_EMAIL_FROM:-}
      PROXY_PROTOCOL: https
      DEFAULT_REGION_ID: ${DEFAULT_REGION_ID:-us}
      DEFAULT_REGION_NAME: ${DEFAULT_REGION_NAME:-us}
      DEFAULT_REGION_ENFORCE_QUOTAS: "true"
      SKIP_USER_EMAIL_VERIFICATION: "false"
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_COLLECTOR_URL: ${OTEL_COLLECTOR_URL:-}
      OTEL_COLLECTOR_API_KEY: ${OTEL_COLLECTOR_API_KEY:-}
      HEALTH_CHECK_API_KEY: ${HEALTH_CHECK_API_KEY:?set HEALTH_CHECK_API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H \"Authorization: Bearer $${HEALTH_CHECK_API_KEY}\" http://localhost:3000/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: 4G }

volumes:
  db_data: {}
  redis_data: {}
  registry: {}
  s3_data: {}
