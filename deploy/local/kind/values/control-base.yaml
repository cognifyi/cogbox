# Base (non-secret) values for local control-plane install.
# Secrets come from the generated overlay (10-control.sh). TEST ONLY.
domain: local.test

api:
  replicaCount: 1
  pdb:
    enabled: false
  hpa:
    enabled: false
  ingress:
    enabled: false
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 2000m, memory: 4Gi }

migration:
  enabled: true

db:
  host: postgres
  port: 5432
  database: cogbox
  username: cogbox
  tlsEnabled: false
  tlsRejectUnauthorized: false

redis:
  host: redis
  port: 6379

oidc:
  clientId: cogbox
  issuerBaseUrl: http://keycloak:8080/realms/cogbox
  publicDomain: http://keycloak:8080/realms/cogbox
  audience: cogbox

# Overridden per-machine by the overlay (kind node IP is not stable).
s3:
  endpoint: http://rustfs:9000
  stsEndpoint: http://rustfs:9000
  region: us-east-1
  defaultBucket: cogbox

dashboard:
  url: http://localhost:3000/dashboard
  baseApiUrl: http://localhost:3000

proxyDefaults:
  protocol: http
  domain: proxy.local.test

defaultSnapshot: cognifyi/sandbox:latest-slim

registry:
  transient:
    url: http://registry:6000
    admin: admin
    projectId: cogbox
  internal:
    url: http://registry:6000
    admin: admin
    projectId: cogbox

quotas:
  defaultRegionId: us
  defaultRegionName: us
  enforceQuotas: false
  totalCpuQuota: 100
  totalMemoryQuota: 256
  totalDiskQuota: 1000
  maxCpuPerSandbox: 4
  maxMemoryPerSandbox: 8
  maxDiskPerSandbox: 50
  snapshotQuota: 30
  maxSnapshotSize: 20
  volumeQuota: 100
  admin:
    totalCpuQuota: 100
    totalMemoryQuota: 256
    totalDiskQuota: 1000
    maxCpuPerSandbox: 4
    maxMemoryPerSandbox: 8
    maxDiskPerSandbox: 50
    snapshotQuota: 30
    maxSnapshotSize: 20
    volumeQuota: 100

rateLimit:
  anonymousTtl: 60
  anonymousLimit: 100
  authenticatedTtl: 60
  authenticatedLimit: 1000
  sandboxCreateTtl: 60
  sandboxCreateLimit: 100
  sandboxLifecycleTtl: 60
  sandboxLifecycleLimit: 200
  failedAuthTtl: 300
  failedAuthLimit: 20

smtp:
  host: ""
  emailFrom: "Cogbox Team <no-reply@example.com>"

otel:
  enabled: false
  collectorUrl: ""

featureFlags:
  forceEnabled: organization_infrastructure

secrets:
  useExternalSecrets: false
  createFromValues: true
