# Dex for LOCAL TEST ONLY (evaluation IdP). Production uses external OIDC.
# Issuer http://dex:5556/dex resolves in-cluster (same namespace as the API).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: control
data:
  config.yaml: |
    issuer: http://dex:5556/dex
    storage:
      type: sqlite3
      config:
        file: /var/dex/dex.db
    web:
      http: 0.0.0.0:5556
    staticClients:
      - id: cogbox
        redirectURIs:
          - 'http://localhost:3000'
          - 'http://localhost:3000/dashboard'
          - 'http://localhost:3000/api/oauth2-redirect.html'
        name: 'Cogbox'
        public: true
    enablePasswordDB: true
    staticPasswords:
      # dev@pazity.com / password — LOCAL TEST ONLY, never production.
      - email: 'dev@pazity.com'
        hash: '$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W'
        username: 'admin'
        userID: '1234'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: control
spec:
  replicas: 1
  selector:
    matchLabels: { app: dex }
  template:
    metadata:
      labels: { app: dex }
    spec:
      containers:
        - name: dex
          image: dexidp/dex:v2.42.0
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          ports: [{ containerPort: 5556 }]
          volumeMounts:
            - { name: config, mountPath: /etc/dex }
            - { name: db, mountPath: /var/dex }
          readinessProbe:
            httpGet: { path: /dex/.well-known/openid-configuration, port: 5556 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: dex-config }
        - name: db
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: control
spec:
  ports: [{ port: 5556 }]
  selector: { app: dex }
---
# TEST-ONLY NodePorts so host processes reach cluster services without
# port-forwards (which die with your shell). Production uses Ingress.
apiVersion: v1
kind: Service
metadata:
  name: api-nodeport
  namespace: control
spec:
  type: NodePort
  ports: [{ port: 80, targetPort: http, nodePort: 30080 }]
  selector:
    app.kubernetes.io/name: cogbox-control
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-nodeport
  namespace: control
spec:
  type: NodePort
  ports: [{ port: 9000, nodePort: 30090 }]
  selector: { app: rustfs }
---
apiVersion: v1
kind: Service
metadata:
  name: registry-nodeport
  namespace: control
spec:
  type: NodePort
  ports: [{ port: 6000, nodePort: 30060 }]
  selector: { app: registry }
