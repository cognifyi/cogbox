# Local kind infrastructure (TEST ONLY — not for production).
# Postgres + Redis + Dex + Registry + S3 + NodePorts.
# Passwords come from the `local-infra` Secret created by 00-cluster.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: control
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: control
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: cogbox }
            - { name: POSTGRES_DB, value: cogbox }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: local-infra, key: postgres-password }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U cogbox"]
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: control
spec:
  ports: [{ port: 5432 }]
  selector: { app: postgres }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: control
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes", "--requirepass", "$(REDIS_PASSWORD)"]
          ports: [{ containerPort: 6379 }]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: local-infra, key: redis-password }
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a $REDIS_PASSWORD ping | grep -q PONG"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: control
spec:
  ports: [{ port: 6379 }]
  selector: { app: redis }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: control
spec:
  replicas: 1
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: registry:2.8.2
          env:
            - { name: REGISTRY_HTTP_ADDR, value: 0.0.0.0:6000 }
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
          ports: [{ containerPort: 6000 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
          readinessProbe:
            httpGet: { path: /v2/, port: 6000 }
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: control
spec:
  ports: [{ port: 6000 }]
  selector: { app: registry }
---
# S3-compatible storage. Production uses GCS/S3; here rustfs on emptyDir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: control
spec:
  replicas: 1
  selector:
    matchLabels: { app: rustfs }
  template:
    metadata:
      labels: { app: rustfs }
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          args: ["/data"]
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: local-infra, key: s3-access-key }
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: local-infra, key: s3-secret-key }
            - { name: RUSTFS_REGION, value: us-east-1 }
            - { name: RUSTFS_ADDRESS, value: ":9000" }
            - { name: RUSTFS_CONSOLE_ADDRESS, value: ":9001" }
            - { name: RUSTFS_CONSOLE_ENABLE, value: "true" }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /health, port: 9000 }
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: control
spec:
  ports:
    - { name: s3, port: 9000 }
    - { name: console, port: 9001 }
  selector: { app: rustfs }
