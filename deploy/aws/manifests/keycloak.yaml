# Keycloak in production mode against the in-cluster postgres.
# TLS terminates at ingress-nginx (cert-manager, public-http01); Keycloak
# advertises the public https issuer. __DOMAIN__ is rendered by 30-infra.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-init
  namespace: control
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: postgres:18
          command:
            - sh
            - -c
            - |
              export PGPASSWORD="$DB_PASSWORD"
              until pg_isready -h postgres -U cogbox; do sleep 3; done
              psql -h postgres -U cogbox -d postgres -tc \
                "SELECT 1 FROM pg_database WHERE datname='keycloak'" | grep -q 1 || \
                psql -h postgres -U cogbox -d postgres -c "CREATE DATABASE keycloak"
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: cogbox-infra, key: postgres-password }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: control
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      nodeSelector:
        cogbox.io/role: system
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.0
          imagePullPolicy: IfNotPresent
          args: ["start", "--import-realm"]
          ports: [{ containerPort: 8080 }]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: { name: keycloak-admin, key: username }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-admin, key: password }
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL_HOST, value: postgres }
            - { name: KC_DB_URL_DATABASE, value: keycloak }
            - { name: KC_DB_USERNAME, value: cogbox }
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: cogbox-infra, key: postgres-password }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HOSTNAME, value: "https://keycloak.__DOMAIN__" }
            - { name: KC_HOSTNAME_STRICT, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_METRICS_ENABLED, value: "true" }
            - name: KC_SMTP_HOST
              valueFrom:
                secretKeyRef: { name: keycloak-smtp, key: host }
            - name: KC_SMTP_PORT
              valueFrom:
                secretKeyRef: { name: keycloak-smtp, key: port }
            - name: KC_SMTP_FROM
              valueFrom:
                secretKeyRef: { name: keycloak-smtp, key: from }
            - name: KC_SMTP_USER
              valueFrom:
                secretKeyRef: { name: keycloak-smtp, key: user }
            - name: KC_SMTP_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-smtp, key: password }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import }
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 20
          resources:
            requests: { cpu: 300m, memory: 768Mi }
            limits: { cpu: 2000m, memory: 2Gi }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: control
spec:
  ports: [{ port: 8080 }]
  selector: { app: keycloak }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: control
  labels:
    app: keycloak
  annotations:
    cert-manager.io/cluster-issuer: public-http01
spec:
  ingressClassName: nginx
  tls:
    - hosts: [keycloak.__DOMAIN__]
      secretName: keycloak-tls
  rules:
    - host: keycloak.__DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port: { number: 8080 }
