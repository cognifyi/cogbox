# Let's Encrypt issuers for the EKS validation cluster.
# __ACME_EMAIL__ is rendered by 27-tls.sh.
# TEST/VALIDATION ONLY.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: wildcard-dns01
spec:
  acme:
    email: __ACME_EMAIL__
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: wildcard-dns01-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: public-http01
spec:
  acme:
    email: __ACME_EMAIL__
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: public-http01-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
