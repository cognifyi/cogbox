apiVersion: v1
kind: Service
metadata:
  name: {{ include "cogbox-control.fullname" . }}-api
  labels:
    {{- include "cogbox-control.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: cogbox-control
    app.kubernetes.io/component: api
---
{{- if .Values.api.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cogbox-control.fullname" . }}-api
  labels:
    {{- include "cogbox-control.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.api.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.api.ingress.className }}
  tls:
    - hosts:
        - {{ printf "cogbox.%s" .Values.domain }}
      secretName: {{ .Values.api.ingress.tlsSecret }}
  rules:
    - host: {{ printf "cogbox.%s" .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cogbox-control.fullname" . }}-api
                port:
                  number: 80
{{- end }}
---
{{- if .Values.api.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cogbox-control.fullname" . }}-api
  labels:
    {{- include "cogbox-control.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cogbox-control.fullname" . }}-api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.cpuUtilization }}
{{- end }}
