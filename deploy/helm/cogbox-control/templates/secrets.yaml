{{- /*
Secret inventory for the control plane. Exactly one of these renders:
1. ExternalSecret (production) when secrets.useExternalSecrets=true.
   Expects each key below in Secret Manager / Vault under
   "<release>-control/<KEY>".
2. Reference to a pre-created Secret when secrets.existingSecret is set
   (nothing renders; the Deployment mounts it).
3. Plain Secret from secrets.values when secrets.createFromValues=true
   (DEV ONLY — CI must fail if this is true in prod values).
*/ -}}
{{- if .Values.secrets.useExternalSecrets }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "cogbox-control.fullname" . }}-secrets
  labels:
    {{- include "cogbox-control.labels" . | nindent 4 }}
  {{- if .Values.migration.enabled }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{ .Values.secrets.externalSecretsStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "cogbox-control.fullname" . }}-secrets
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef: { key: {{ printf "%s-control/ENCRYPTION_KEY" .Release.Name | quote }} }
    - secretKey: ENCRYPTION_SALT
      remoteRef: { key: {{ printf "%s-control/ENCRYPTION_SALT" .Release.Name | quote }} }
    - secretKey: DB_PASSWORD
      remoteRef: { key: {{ printf "%s-control/DB_PASSWORD" .Release.Name | quote }} }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: {{ printf "%s-control/REDIS_PASSWORD" .Release.Name | quote }} }
    - secretKey: S3_ACCESS_KEY
      remoteRef: { key: {{ printf "%s-control/S3_ACCESS_KEY" .Release.Name | quote }} }
    - secretKey: S3_SECRET_KEY
      remoteRef: { key: {{ printf "%s-control/S3_SECRET_KEY" .Release.Name | quote }} }
    - secretKey: TRANSIENT_REGISTRY_PASSWORD
      remoteRef: { key: {{ printf "%s-control/TRANSIENT_REGISTRY_PASSWORD" .Release.Name | quote }} }
    - secretKey: INTERNAL_REGISTRY_PASSWORD
      remoteRef: { key: {{ printf "%s-control/INTERNAL_REGISTRY_PASSWORD" .Release.Name | quote }} }
    - secretKey: PROXY_API_KEY
      remoteRef: { key: {{ printf "%s-control/PROXY_API_KEY" .Release.Name | quote }} }
    - secretKey: SSH_GATEWAY_API_KEY
      remoteRef: { key: {{ printf "%s-control/SSH_GATEWAY_API_KEY" .Release.Name | quote }} }
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: { key: {{ printf "%s-control/OIDC_CLIENT_SECRET" .Release.Name | quote }} }
    - secretKey: OIDC_MANAGEMENT_API_CLIENT_SECRET
      remoteRef: { key: {{ printf "%s-control/OIDC_MANAGEMENT_API_CLIENT_SECRET" .Release.Name | quote }} }
    - secretKey: SMTP_USER
      remoteRef: { key: {{ printf "%s-control/SMTP_USER" .Release.Name | quote }} }
    - secretKey: SMTP_PASSWORD
      remoteRef: { key: {{ printf "%s-control/SMTP_PASSWORD" .Release.Name | quote }} }
    - secretKey: OTEL_COLLECTOR_API_KEY
      remoteRef: { key: {{ printf "%s-control/OTEL_COLLECTOR_API_KEY" .Release.Name | quote }} }
    - secretKey: OTEL_EXPORTER_OTLP_HEADERS
      remoteRef: { key: {{ printf "%s-control/OTEL_EXPORTER_OTLP_HEADERS" .Release.Name | quote }} }
    - secretKey: POSTHOG_API_KEY
      remoteRef: { key: {{ printf "%s-control/POSTHOG_API_KEY" .Release.Name | quote }} }
    - secretKey: HEALTH_CHECK_API_KEY
      remoteRef: { key: {{ printf "%s-control/HEALTH_CHECK_API_KEY" .Release.Name | quote }} }
    - secretKey: ADMIN_API_KEY
      remoteRef: { key: {{ printf "%s-control/ADMIN_API_KEY" .Release.Name | quote }} }
{{- else if .Values.secrets.createFromValues }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cogbox-control.fullname" . }}-secrets
  labels:
    {{- include "cogbox-control.labels" . | nindent 4 }}
  annotations:
    cogbox.io/dev-only-secret: "true"
    {{- if .Values.migration.enabled }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- end }}
type: Opaque
stringData:
  ENCRYPTION_KEY: {{ .Values.secrets.values.ENCRYPTION_KEY | default "" | quote }}
  ENCRYPTION_SALT: {{ .Values.secrets.values.ENCRYPTION_SALT | default "" | quote }}
  DB_PASSWORD: {{ .Values.secrets.values.DB_PASSWORD | default "" | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.values.REDIS_PASSWORD | default "" | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.values.S3_ACCESS_KEY | default "" | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.values.S3_SECRET_KEY | default "" | quote }}
  TRANSIENT_REGISTRY_PASSWORD: {{ .Values.secrets.values.TRANSIENT_REGISTRY_PASSWORD | default "" | quote }}
  INTERNAL_REGISTRY_PASSWORD: {{ .Values.secrets.values.INTERNAL_REGISTRY_PASSWORD | default "" | quote }}
  PROXY_API_KEY: {{ .Values.secrets.values.PROXY_API_KEY | default "" | quote }}
  SSH_GATEWAY_API_KEY: {{ .Values.secrets.values.SSH_GATEWAY_API_KEY | default "" | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.values.OIDC_CLIENT_SECRET | default "" | quote }}
  OIDC_MANAGEMENT_API_CLIENT_SECRET: {{ .Values.secrets.values.OIDC_MANAGEMENT_API_CLIENT_SECRET | default "" | quote }}
  SMTP_USER: {{ .Values.secrets.values.SMTP_USER | default "" | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.values.SMTP_PASSWORD | default "" | quote }}
  OTEL_COLLECTOR_API_KEY: {{ .Values.secrets.values.OTEL_COLLECTOR_API_KEY | default "" | quote }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ .Values.secrets.values.OTEL_EXPORTER_OTLP_HEADERS | default "" | quote }}
  POSTHOG_API_KEY: {{ .Values.secrets.values.POSTHOG_API_KEY | default "" | quote }}
  HEALTH_CHECK_API_KEY: {{ .Values.secrets.values.HEALTH_CHECK_API_KEY | default "" | quote }}
  ADMIN_API_KEY: {{ .Values.secrets.values.ADMIN_API_KEY | default "" | quote }}
{{- end }}
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default (include "cogbox-control.fullname" .) }}
  labels:
    {{- include "cogbox-control.labels" . | nindent 4 }}
  {{- /*
    Hook the ServiceAccount ahead of the migration Jobs: hooks run before
    regular resources exist, and the Jobs reference this account. Weight -10
    sorts before the pre-migrations at -5. The account persists (only
    before-hook-creation cleanup, no hook-succeeded deletion).
  */}}
  {{- if .Values.migration.enabled }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
automountServiceAccountToken: true
{{- end }}
