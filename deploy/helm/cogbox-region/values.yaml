# Default values for cogbox-region.
# Install ONE release per region: shared, dedicated, or custom.
# Region credentials (PROXY_API_KEY, SSH key, snapshot creds, runner token)
# come from the control-plane region registration — see secrets.* below.

imageRegistry: cognifyi
imageTag: "v0.190.3"
imageDigest: ""
imagePullPolicy: IfNotPresent

# Must match the region name registered in the control plane (POST /regions).
regionName: shared-us
controlPlaneApiUrl: https://cogbox.example.com/api

# Application nodes are labeled pool=standard. Runner nodes are labeled
# pool=runner and tainted cogbox.io/runner=NoSchedule; only the runner
# workload tolerates the taint. runner.nodeSelector overrides nodeSelector.
nodeSelector:
  cogbox.io/region: shared-us
  cogbox.io/pool: standard
tolerations:
  - key: cogbox.io/runner
    operator: Exists
    effect: NoSchedule

proxy:
  repository: cogbox-proxy
  replicaCount: 2
  port: 4000
  protocol: https
  # Bare hostname. The wildcard (for {{PORT}}-{{sandboxId}} previews) is derived:
  # proxy.example.com -> *.proxy.example.com
  host: proxy.example.com
  cookieDomain: example.com
  ingress:
    className: nginx
    clusterIssuer: wildcard-dns01
    tlsSecret: proxy-wildcard-tls
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    cpuUtilization: 70
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  toolboxOnlyMode: false
  previewWarningEnabled: false
  shutdownTimeoutSec: 3600

snapshotManager:
  enabled: true
  repository: cogbox-snapshot-manager
  replicaCount: 1
  port: 5000
  host: snapshots.example.com
  ingress:
    className: nginx
    clusterIssuer: public-http01
    tlsSecret: snapshots-tls
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
  storage:
    # filesystem (PVC, default) or s3. Use s3 ONLY against a real S3 API —
    # the registry driver needs full multipart semantics. On GCP the safe
    # default is filesystem on a regional persistent disk.
    driver: filesystem
    size: 200Gi
    storageClass: ""
    deleteEnabled: true
    s3:
      region: auto
      bucket: ""
      endpoint: https://storage.googleapis.com
      encrypt: false
      secure: true
      rootDirectory: snapshots
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 2Gi }

runner:
  repository: cogbox-runner
  apiPort: 3003
  # daemonset = one runner per runner-pool node (default; pilot only: every
  # pod shares RUNNER_TOKEN, so use a single runner node or statefulset for
  # multiple nodes). deployment = single-replica pilot. statefulset = scalable
  # replica set with stable ordinals; required for per-replica runner tokens
  # and runner.autoscaler. hostPort keeps at most one runner pod per node in
  # every mode.
  mode: daemonset
  # Initial replicas for deployment/statefulset mode. Ignored when
  # runner.autoscaler.enabled: the chart then omits spec.replicas so Helm
  # upgrades do not reset the count owned by the autoscaler/park scripts.
  replicas: 1
  # runner.nodeSelector defaults to the top-level nodeSelector. GCP overlays
  # set it to cogbox.io/pool=runner to keep runners off the app pool.
  # Optional container entrypoint override. Used by the AWS overlay to put
  # dockerd's data root on a pquota-enabled XFS loopback (sandbox disk quotas).
  command: []
  args: []
  # Advertised runner hostname (validated as hostname|ip — region IDs with
  # underscores are NOT valid here). Leave empty to omit; runners self-report
  # via healthcheck. Set to a real node/hostname only if your topology needs it.
  domain: ""
  # Per-replica credentials for statefulset mode. token-N is mounted as
  # /tokens/token-N and selected by the pod ordinal. Provision one control
  # plane Runner per token (scripts/25-runner-tokens.sh); never share one
  # token across replicas, or every pod reports as the same Runner.
  tokens:
    # Pre-created Secret with keys token-0..token-(maxReplicas-1).
    # Empty = chart-managed <fullname>-runner-tokens.
    existingSecret: ""
  resources:
    requests: { cpu: 1000m, memory: 2Gi }
    limits: { cpu: 4000m, memory: 8Gi }
  # Scale the runner workload up when allocated sandbox CPU approaches the
  # current pool's usable capacity. Scale-up only: scale-down is a deliberate
  # drain operation (park or kubectl scale) so a busy runner is never deleted.
  # statefulset mode uses one token per ordinal, so maxReplicas also determines
  # how many runner tokens/records must exist.
  autoscaler:
    enabled: false
    schedule: "* * * * *"
    # Keep within one minor version of the cluster API server.
    image: alpine/k8s:1.36.5
    maxReplicas: 5
    # Usable sandbox CPU per 4 vCPU runner node after system + runner overhead.
    cpuPerRunner: 3
    targetUtilization: "0.8"
  env:
    ENVIRONMENT: production
    # OCI runtime for sandbox containers. Empty = Docker default (runc).
    # Set to sysbox-runc ONLY on nodes where Sysbox is installed (via the
    # runtime-installer); otherwise sandbox creation fails.
    CONTAINER_RUNTIME: ""
    RESOURCE_LIMITS_DISABLED: "false"
    INTER_SANDBOX_NETWORK_ENABLED: "false"
    SSH_GATEWAY_ENABLE: "true"
    SSH_GATEWAY_PORT: "2220"
    BUILD_ENGINE: buildkit
    AWS_REGION: auto
    AWS_ENDPOINT_URL: https://storage.googleapis.com
    AWS_DEFAULT_BUCKET: cogbox-region-shared-us
  # Host paths the runner needs (Docker data + sandbox volumes).
  hostPaths:
    varLibCogbox: /var/lib/cogbox
    # Host Docker socket: the runner drives the HOST Docker daemon to spawn
    # sandbox containers. Requires Docker installed on runner nodes (job of the
    # runtime-installer). Disable on runtimes without host Docker (e.g. kind
    # smoke tests) — sandboxes can't actually run there anyway.
    dockerSock:
      enabled: true
      path: /var/run/docker.sock
    # Persist the runner's OWN dind data root (/var/lib/docker) so sandbox
    # containers survive runner pod restarts/rollouts. Only relevant when
    # dockerSock.enabled=false (internal dind). Without this, every runner
    # restart wipes the container store while the control plane still tracks
    # the sandboxes -> STOP/START jobs fail with "No such container".
    # node-local: survives pod restarts, NOT node replacement.
    varLibDocker:
      enabled: false
      path: /var/lib/cogbox-docker

sshGateway:
  repository: cogbox-ssh-gateway
  replicaCount: 2
  port: 2222
  # Raw TCP — LoadBalancer, NOT behind Ingress.
  serviceType: LoadBalancer

# --- Secrets ---
# Same three modes as cogbox-control. Keys are per-REGION (from registration):
# PROXY_API_KEY, SSH_API_KEY, SNAP_USER, SNAP_PASS, SSH_PRIVATE_KEY,
# SSH_HOST_KEY, SSH_PUBLIC_KEY (runner pool copy).
# daemonset/deployment mode also needs RUNNER_TOKEN; statefulset mode instead
# uses one Secret Manager entry per replica named <release>-runner-token-N
# (mapped to token-N by the chart's ExternalSecret). With
# secrets.createFromValues, set RUNNER_TOKEN_0..RUNNER_TOKEN_(N-1), where N =
# runner.autoscaler.maxReplicas.
secrets:
  useExternalSecrets: false
  externalSecretsStore: secretstore-gcp
  existingSecret: ""
  createFromValues: false
  values: {}
    # PROXY_API_KEY: ...
    # SSH_API_KEY: ...
    # SNAP_USER: ...
    # SNAP_PASS: ...
    # RUNNER_TOKEN: ...
    # RUNNER_TOKEN_0: ...  # statefulset mode, one per replica
    # RUNNER_TOKEN_1: ...
