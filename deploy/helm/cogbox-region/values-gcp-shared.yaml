# GCP shared-region overrides for cogbox-region.
# Cluster: GKE Standard (Autopilot CANNOT run the privileged runner workload).
# Node pools: system pool (control plane) + runner pools below.

# NOTE: this example uses shared-us. The GCP cluster script defaults
# NODE_REGION_LABEL=shared; set NODE_REGION_LABEL=shared-us or change these
# values so the nodeSelector matches the labels on the nodes.
regionName: shared-us
controlPlaneApiUrl: https://cogbox.example.com/api

nodeSelector:
  cogbox.io/region: shared-us
  cogbox.io/pool: standard

proxy:
  host: proxy.example.com
  cookieDomain: example.com
  ingress:
    className: nginx
    clusterIssuer: wildcard-dns01

snapshotManager:
  host: snapshots.example.com
  ingress:
    className: nginx
    clusterIssuer: public-http01
  storage:
    # Regional PD via the default GKE storage class (leave storageClass empty
    # to use cluster default, or set e.g. premium-rwo).
    driver: filesystem
    size: 200Gi
    storageClass: ""

runner:
  # For horizontal runner autoscaling use mode: statefulset and
  # autoscaler.enabled: true (see deploy/gcp/values-region-pazity.yaml), then
  # provision one runner token per replica with scripts/25-runner-tokens.sh.
  nodeSelector:
    cogbox.io/region: shared-us
    cogbox.io/pool: runner
  # Path B: use the runner image's internal dockerd and persist its data root.
  # GKE COS has no host dockerd, so the runtime-installer init container is
  # disabled by turning off the host socket.
  hostPaths:
    dockerSock:
      enabled: false
    varLibDocker:
      enabled: true
  env:
    AWS_REGION: auto
    AWS_ENDPOINT_URL: https://storage.googleapis.com
    AWS_DEFAULT_BUCKET: cogbox-region-shared-us

secrets:
  useExternalSecrets: true
  externalSecretsStore: secretstore-gcp
