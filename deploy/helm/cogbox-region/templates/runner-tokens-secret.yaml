{{- /*
Per-replica runner credentials. Only used by runner.mode=statefulset: pod
ordinal N reads token-N, so every replica registers as a distinct Runner in
the control plane. The tokens are issued by the control plane admin API
(scripts/25-runner-tokens.sh) and stored under
"<release>-runner-token-<N>" in the external secret store.
*/ -}}
{{- $mode := .Values.runner.mode | default "daemonset" -}}
{{- if eq $mode "statefulset" }}
{{- $count := int .Values.runner.autoscaler.maxReplicas }}
{{- if lt $count 1 }}
{{- fail "runner.autoscaler.maxReplicas must be >= 1 for runner.mode=statefulset" }}
{{- end }}
{{- if dig "tokens" "existingSecret" "" .Values.runner }}
{{- /* pre-created Secret; nothing to render */ -}}
{{- else if .Values.secrets.useExternalSecrets }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "cogbox-region.runnerTokensSecretName" . }}
  labels:
    {{- include "cogbox-region.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner-tokens
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{ .Values.secrets.externalSecretsStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "cogbox-region.runnerTokensSecretName" . }}
  data:
    {{- range $i := until $count }}
    - secretKey: token-{{ $i }}
      remoteRef: { key: {{ printf "%s-runner-token-%d" $.Release.Name $i | quote }} }
    {{- end }}
{{- else if .Values.secrets.createFromValues }}
{{- $values := .Values.secrets.values | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cogbox-region.runnerTokensSecretName" . }}
  labels:
    {{- include "cogbox-region.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner-tokens
  annotations:
    cogbox.io/dev-only-secret: "true"
type: Opaque
stringData:
  {{- range $i := until $count }}
  token-{{ $i }}: {{ required (printf "secrets.values.RUNNER_TOKEN_%d is required for runner.mode=statefulset" $i) (index $values (printf "RUNNER_TOKEN_%d" $i)) | quote }}
  {{- end }}
{{- else }}
{{- fail "runner.mode=statefulset requires secrets.useExternalSecrets, secrets.createFromValues, or runner.tokens.existingSecret" }}
{{- end }}
{{- end }}
