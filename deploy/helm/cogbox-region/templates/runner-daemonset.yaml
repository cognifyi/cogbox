{{- /*
Runner pool. Privileged DaemonSet (default), Deployment, or StatefulSet on
tainted runner nodes. REQUIRES GKE Standard (or any K8s allowing privileged
pods) — Autopilot forbids this. An init container bootstraps the host container
runtime from inside the pod (nsenter into the host: install Docker +
sandbox-capable OCI runtime, write daemon.json with inter-container
communication disabled and your DNS). It is skipped when
runner.hostPaths.dockerSock.enabled=false (internal dind mode).

statefulset mode gives every replica a stable ordinal and its own control-plane
token (token-N from the runner-tokens Secret). Do not use a shared token for
multiple replicas: the control plane keys a Runner by API key, so all pods
would overwrite the same domain/metrics and jobs could run on the wrong node.
*/ -}}
{{- $mode := .Values.runner.mode | default "daemonset" -}}
{{- if not (has $mode (list "daemonset" "deployment" "statefulset")) -}}
{{- fail (printf "runner.mode must be daemonset, deployment, or statefulset (got %q)" $mode) -}}
{{- end -}}
{{- if and (eq $mode "deployment") (gt (int (.Values.runner.replicas | default 1)) 1) -}}
{{- fail "runner.mode=deployment uses a shared RUNNER_TOKEN and supports only one replica; use runner.mode=statefulset for multiple runners" -}}
{{- end -}}
{{- $fullname := include "cogbox-region.fullname" . -}}
{{- $manageReplicas := not .Values.runner.autoscaler.enabled -}}
{{- if eq $mode "statefulset" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-runner-headless
  labels:
    {{- include "cogbox-region.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cogbox-region
    app.kubernetes.io/component: runner
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: api
      port: {{ .Values.runner.apiPort }}
      targetPort: api
---
{{- end }}
apiVersion: apps/v1
kind: {{ if eq $mode "deployment" }}Deployment{{ else if eq $mode "statefulset" }}StatefulSet{{ else }}DaemonSet{{ end }}
metadata:
  name: {{ $fullname }}-runner
  labels:
    {{- include "cogbox-region.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  {{- if eq $mode "statefulset" }}
  serviceName: {{ $fullname }}-runner-headless
  {{- if $manageReplicas }}
  replicas: {{ .Values.runner.replicas | default 1 }}
  {{- end }}
  podManagementPolicy: Parallel
  # OnDelete keeps image upgrades from silently rescheduling a busy runner to
  # another node and losing its node-local sandbox store. Drain first, then
  # delete the pod.
  updateStrategy:
    type: OnDelete
  {{- else if eq $mode "deployment" }}
  {{- if $manageReplicas }}
  replicas: {{ .Values.runner.replicas | default 1 }}
  {{- end }}
  # hostPort allows only one runner per node; surge would leave the new pod
  # Pending until the old one is gone, so replace in place.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cogbox-region
      app.kubernetes.io/component: runner
      {{- if eq $mode "statefulset" }}
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogbox-region
        app.kubernetes.io/component: runner
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        cogbox.io/region: {{ .Values.regionName | quote }}
    spec:
      nodeSelector:
        {{- toYaml (.Values.runner.nodeSelector | default .Values.nodeSelector) | nindent 8 }}
      tolerations:
        {{- toYaml (.Values.runner.tolerations | default .Values.tolerations) | nindent 8 }}
      {{- if or (eq $mode "statefulset") .Values.runner.hostPaths.dockerSock.enabled }}
      initContainers:
        {{- if eq $mode "statefulset" }}
        - name: token-selector
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ordinal="${HOSTNAME##*-}"
              test -f "/tokens/token-${ordinal}"
              cp "/tokens/token-${ordinal}" /run/secrets/runner-token
          volumeMounts:
            - name: runner-tokens
              mountPath: /tokens
              readOnly: true
            - name: runner-token
              mountPath: /run/secrets
        {{- end }}
        {{- if .Values.runner.hostPaths.dockerSock.enabled }}
        - name: runtime-installer
          image: ubuntu:24.04
          securityContext:
            privileged: true
          # NOTE: nsenter switches to the HOST mount namespace before exec, so
          # the script path itself is invisible there. The `<` redirect is
          # evaluated by the outer (container) shell where the ConfigMap
          # mount exists; the script body flows to the host-side bash via stdin.
          # Keep the script self-contained (no relative file references).
          command: ["/bin/bash", "-c"]
          args:
            - >-
              nsenter --mount=/host/proc/1/ns/mnt --net=/host/proc/1/ns/net --
              bash -s < /opt/cogbox/install-runtime.sh
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: installer
              mountPath: /opt/cogbox
        {{- end }}
      {{- end }}
      containers:
        - name: runner
          image: {{ include "cogbox-region.image" (dict "repository" .Values.runner.repository "Values" .Values) | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- with .Values.runner.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.runner.args }}
          args: {{ toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            privileged: true
          {{- if eq $mode "statefulset" }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export COGBOX_RUNNER_TOKEN="$(cat /run/secrets/runner-token)"
              /usr/local/bin/dockerd-entrypoint.sh &
              exec /usr/local/bin/cogbox-runner
          {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.runner.apiPort }}
              hostPort: {{ .Values.runner.apiPort }}
            - name: ssh
              containerPort: 2220
              hostPort: 2220
          env:
            - name: COGBOX_API_URL
              value: {{ .Values.controlPlaneApiUrl | quote }}
            {{- if ne $mode "statefulset" }}
            - name: COGBOX_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cogbox-region.secretName" . }}
                  key: RUNNER_TOKEN
            {{- end }}
            - name: API_PORT
              value: {{ .Values.runner.apiPort | quote }}
            {{- if .Values.runner.domain }}
            - name: RUNNER_DOMAIN
              value: {{ .Values.runner.domain | quote }}
            {{- end }}
            - name: SSH_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cogbox-region.secretName" . }}
                  key: SSH_PUBLIC_KEY
            {{- range $k, $v := .Values.runner.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/cogbox
            {{- if eq $mode "statefulset" }}
            - name: runner-token
              mountPath: /run/secrets
              readOnly: true
            {{- end }}
            {{- if .Values.runner.hostPaths.dockerSock.enabled }}
            - name: docker-sock
              mountPath: /var/run/docker.sock
            {{- end }}
            {{- if and .Values.runner.hostPaths.varLibDocker .Values.runner.hostPaths.varLibDocker.enabled }}
            - name: docker-data
              mountPath: /var/lib/docker
            {{- end }}
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
      volumes:
        {{- if eq $mode "statefulset" }}
        - name: runner-tokens
          secret:
            secretName: {{ include "cogbox-region.runnerTokensSecretName" . }}
        - name: runner-token
          emptyDir: {}
        {{- end }}
        {{- if .Values.runner.hostPaths.dockerSock.enabled }}
        - name: host-root
          hostPath: { path: /, type: Directory }
        - name: installer
          configMap:
            name: {{ $fullname }}-runtime-installer
        {{- end }}
        - name: data
          hostPath:
            path: {{ .Values.runner.hostPaths.varLibCogbox }}
            type: DirectoryOrCreate
        {{- if .Values.runner.hostPaths.dockerSock.enabled }}
        - name: docker-sock
          hostPath:
            path: {{ .Values.runner.hostPaths.dockerSock.path }}
            type: Socket
        {{- end }}
        {{- if and .Values.runner.hostPaths.varLibDocker .Values.runner.hostPaths.varLibDocker.enabled }}
        - name: docker-data
          hostPath:
            path: {{ .Values.runner.hostPaths.varLibDocker.path }}
            type: DirectoryOrCreate
        {{- end }}
{{- if .Values.runner.hostPaths.dockerSock.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-runtime-installer
  labels:
    {{- include "cogbox-region.labels" . | nindent 4 }}
data:
  install-runtime.sh: |
    #!/bin/bash
    # Runs on the HOST via nsenter. Idempotent: safe to re-run on every rollout.
    set -euo pipefail
    # 1. Install Docker + sandbox-capable OCI runtime if missing (pin versions!).
    # 2. Write /etc/docker/daemon.json:
    #      {"icc": false, "live-restore": true, "dns": ["YOUR_DNS_1", "YOUR_DNS_2"]}
    #    icc:false = no inter-container communication (sandbox isolation).
    #    live-restore = running sandboxes survive dockerd restarts during rolls.
    # 3. Restart dockerd ONLY if daemon.json changed.
    # Operate this script per OS image of your node pool (Ubuntu/COS notes in docs).
    echo "runtime installer placeholder - replace with your node image script"
{{- end }}
