{{- /*
Per-region secret inventory. One source only:
1. ExternalSecret (production) — keys below in Secret Manager / Vault under
   "<release>/<KEY>".
2. Pre-created Secret via secrets.existingSecret (nothing renders).
3. Plain Secret from secrets.values (DEV ONLY).
Rotate: regenerate at the control plane -> update the secret -> rollout restart
the region workloads -> verify one sandbox lifecycle -> expire the old key.
*/ -}}
{{- if .Values.secrets.useExternalSecrets }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "cogbox-region.fullname" . }}-creds
  labels:
    {{- include "cogbox-region.labels" . | nindent 4 }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{ .Values.secrets.externalSecretsStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "cogbox-region.fullname" . }}-creds
  data:
    - secretKey: PROXY_API_KEY
      remoteRef: { key: {{ printf "%s/PROXY_API_KEY" .Release.Name | quote }} }
    - secretKey: SSH_API_KEY
      remoteRef: { key: {{ printf "%s/SSH_API_KEY" .Release.Name | quote }} }
    - secretKey: SNAP_USER
      remoteRef: { key: {{ printf "%s/SNAP_USER" .Release.Name | quote }} }
    - secretKey: SNAP_PASS
      remoteRef: { key: {{ printf "%s/SNAP_PASS" .Release.Name | quote }} }
    - secretKey: RUNNER_TOKEN
      remoteRef: { key: {{ printf "%s/RUNNER_TOKEN" .Release.Name | quote }} }
    - secretKey: SSH_PRIVATE_KEY
      remoteRef: { key: {{ printf "%s/SSH_PRIVATE_KEY" .Release.Name | quote }} }
    - secretKey: SSH_HOST_KEY
      remoteRef: { key: {{ printf "%s/SSH_HOST_KEY" .Release.Name | quote }} }
    - secretKey: SSH_PUBLIC_KEY
      remoteRef: { key: {{ printf "%s/SSH_PUBLIC_KEY" .Release.Name | quote }} }
    - secretKey: SNAP_S3_ACCESS_KEY
      remoteRef: { key: {{ printf "%s/SNAP_S3_ACCESS_KEY" .Release.Name | quote }} }
    - secretKey: SNAP_S3_SECRET_KEY
      remoteRef: { key: {{ printf "%s/SNAP_S3_SECRET_KEY" .Release.Name | quote }} }
{{- else if .Values.secrets.createFromValues }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cogbox-region.fullname" . }}-creds
  labels:
    {{- include "cogbox-region.labels" . | nindent 4 }}
  annotations:
    cogbox.io/dev-only-secret: "true"
type: Opaque
stringData:
  PROXY_API_KEY: {{ .Values.secrets.values.PROXY_API_KEY | default "" | quote }}
  SSH_API_KEY: {{ .Values.secrets.values.SSH_API_KEY | default "" | quote }}
  SNAP_USER: {{ .Values.secrets.values.SNAP_USER | default "" | quote }}
  SNAP_PASS: {{ .Values.secrets.values.SNAP_PASS | default "" | quote }}
  RUNNER_TOKEN: {{ .Values.secrets.values.RUNNER_TOKEN | default "" | quote }}
  SSH_PRIVATE_KEY: {{ .Values.secrets.values.SSH_PRIVATE_KEY | default "" | quote }}
  SSH_HOST_KEY: {{ .Values.secrets.values.SSH_HOST_KEY | default "" | quote }}
  SSH_PUBLIC_KEY: {{ .Values.secrets.values.SSH_PUBLIC_KEY | default "" | quote }}
  SNAP_S3_ACCESS_KEY: {{ .Values.secrets.values.SNAP_S3_ACCESS_KEY | default "" | quote }}
  SNAP_S3_SECRET_KEY: {{ .Values.secrets.values.SNAP_S3_SECRET_KEY | default "" | quote }}
{{- end }}
