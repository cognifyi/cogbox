# Branch dev images
#
# Publishes per-branch dev container images so a branch can be deployed to the
# dev track (deploy/dev/k3s) for testing.
#
# Side effects are deliberately limited and namespaced:
#   - never pushes `:latest`
#   - never touches the release tag namespace (`vX.Y.Z[-dev]`, `libs/*/vX.Y.Z`)
#   - never creates GitHub Releases or opens PRs
#   - the ONLY git tag it creates is `dev/<branch-slug>/<short-sha>` (annotated),
#     after the images are successfully pushed. That namespace is not SemVer, so
#     it is ignored by Go module resolution and by `nx release`.
#
# Image tag: `<version>-<branch-slug>-<short-sha>` (immutable per commit).
# Dispatch on ANY branch; only that branch's commit is built.
# Version input is restricted to `vX.Y.Z-dev` (e.g. `v0.0.0-dev`) so a real
# release can never be published from this workflow.

name: Branch Dev Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Dev version (must match vX.Y.Z-dev, e.g. v0.0.0-dev)'
        required: true
        default: 'v0.0.0-dev'

permissions: {}

env:
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1
  IMAGE_NAMESPACE: cognifyi

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.repository == 'cognifyi/cogbox'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      git_tag: ${{ steps.tag.outputs.git_tag }}
    steps:
      - name: Validate version format
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev$ ]]; then
            echo "::error::Invalid version '$VERSION_INPUT' (expected vX.Y.Z-dev, e.g. v0.0.0-dev)"
            exit 1
          fi

      - name: Compute image and git tags
        id: tag
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Docker tags allow [A-Za-z0-9_.-]; GitHub branch names may contain '/'.
          slug="$(printf '%s' "$GITHUB_REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^[-_.]+//; s/[-_.]+$//' \
            | cut -c1-40)"
          [ -n "$slug" ] || slug="branch"
          short_sha="${GITHUB_SHA:0:12}"
          image_tag="${VERSION_INPUT}-${slug}-${short_sha}"
          git_tag="dev/${slug}/${short_sha}"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "git_tag=${git_tag}" >> "$GITHUB_OUTPUT"
          {
            echo "### Branch dev images"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| branch | \`${GITHUB_REF_NAME}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| image tag | \`${image_tag}\` |"
            echo "| git tag | \`${git_tag}\` |"
            echo ""
            echo "Deploy: \`./deploy/dev/k3s/deploy.sh ${image_tag}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  prepare:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          go-cache: 'false'
          install-python: 'false'
          install-ruby: 'false'
          install-java: 'false'
          install-poetry: 'false'
          install-swag: 'false'
          run-poetry-install: 'false'
          run-go-work-sync: 'false'

      - name: Ensure go.work.sum exists
        # The Go Dockerfiles COPY go.work go.work.sum; `go work sync` is skipped
        # above, so make sure the file is present.
        run: touch go.work.sum

      - name: Build computer-use (amd64)
        # The runner Dockerfile COPYs dist/libs/computer-use-amd64. Build it once
        # here so both arch runners reuse the same binary (mirrors release.yaml).
        run: yarn nx run computer-use:build-amd64

      - name: Upload computer-use artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: computer-use-amd64
          path: dist/libs/computer-use-amd64
          retention-days: 1
          overwrite: true

  docker_build:
    needs: [resolve, prepare]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download computer-use artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: computer-use-amd64
          path: dist/libs/

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Generate go.work.sum
        run: |
          GONOSUMDB=github.com/${{ github.repository }} go work sync
          touch go.work.sum

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0

      - name: Project dependencies
        run: corepack enable
      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-${{ runner.arch }}-
      - run: yarn install --immutable

      - name: Build and push images
        # Tags become cognifyi/cogbox-<project>:<image_tag>-<arch>.
        env:
          VERSION: ${{ needs.resolve.outputs.image_tag }}
          ARCH: -${{ matrix.arch }}
        run: yarn docker:production

      - name: Cleanup credentials
        if: always()
        run: |
          docker logout docker.io 2>/dev/null || true
          docker logout ghcr.io 2>/dev/null || true

  finalize:
    needs: [resolve, docker_build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
      GIT_TAG: ${{ needs.resolve.outputs.git_tag }}
      VERSION_INPUT: ${{ inputs.version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        # imagetools talks to the registry directly; a stock docker-container
        # builder avoids the Blacksmith-pinned buildx quirks with new tags.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          set -euo pipefail
          projects=()
          for f in apps/*/project.json libs/*/project.json; do
            [ -f "$f" ] || continue
            if grep -q '"docker"' "$f"; then
              projects+=("$(basename "$(dirname "$f")")")
            fi
          done
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "::error::No projects with a docker target found"
            exit 1
          fi
          echo "Projects: ${projects[*]}"
          : > /tmp/images.tsv
          for p in "${projects[@]}"; do
            img="${IMAGE_NAMESPACE}/cogbox-${p}:${IMAGE_TAG}"
            echo "==> ${img}"
            docker buildx imagetools create -t "${img}" "${img}-amd64" "${img}-arm64"
            # Registry digest of the manifest list = sha256 of its raw bytes.
            digest="sha256:$(docker buildx imagetools inspect "${img}" --raw | sha256sum | cut -d' ' -f1)"
            printf '%s\t%s\n' "${img}" "${digest}" >> /tmp/images.tsv
          done
          cat /tmp/images.tsv

      - name: Write build manifest
        run: |
          set -euo pipefail
          jq -Rn \
            --arg version "$VERSION_INPUT" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg git_sha "$GITHUB_SHA" \
            --arg image_tag "$IMAGE_TAG" \
            --arg git_tag "$GIT_TAG" \
            '[inputs | select(length > 0) | split("\t") | {image: .[0], digest: .[1]}]
             | {version: $version, branch: $branch, gitSha: $git_sha, imageTag: $image_tag, gitTag: $git_tag, images: .}' \
            < /tmp/images.tsv > build-manifest.json
          cat build-manifest.json

      - name: Upload build manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-manifest
          path: build-manifest.json
          retention-days: 7

      - name: Configure git
        run: |
          git config user.name "Cogbox Dev Build Bot"
          git config user.email "cogbox-dev-build@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"

      - name: Create and push dev tag
        # Namespaced, annotated, idempotent per commit. Only reached after the
        # images pushed, so the tag never points at a commit with no artifact.
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${GIT_TAG}" >/dev/null 2>&1; then
            echo "Tag ${GIT_TAG} already exists; nothing to do."
            exit 0
          fi
          msg="$(printf 'Branch dev build\n\nversion: %s\nbranch: %s\ncommit: %s\nimage tag: %s\n\nImages:' \
            "$VERSION_INPUT" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$IMAGE_TAG")"
          while IFS=$'\t' read -r image digest; do
            msg="${msg}"$'\n'"  ${image}@${digest}"
          done < /tmp/images.tsv
          git tag -a "${GIT_TAG}" "${GITHUB_SHA}" -m "${msg}"
          if git push origin "${GIT_TAG}" 2>/tmp/push.err; then
            echo "Pushed ${GIT_TAG}"
          else
            if grep -q "already exists" /tmp/push.err; then
              echo "Tag ${GIT_TAG} already exists on the remote; nothing to do."
            else
              cat /tmp/push.err >&2
              exit 1
            fi
          fi

      - name: Cleanup credentials
        if: always()
        run: |
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}" 2>/dev/null || true
          docker logout docker.io 2>/dev/null || true
          docker logout ghcr.io 2>/dev/null || true
