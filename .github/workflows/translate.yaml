name: GT Translate
# NOTE: auto-trigger on push is disabled on purpose. The pinned
# generaltranslation/translate action + locadex@0.1.17 only supports
# Next.js projects with the legacy `gt-next` package, while this repo
# uses `gt-react` on an Astro docs site, so every automatic run fails.
# Keep the workflow available for manual runs only (upstream removed
# this file entirely).
on:
  workflow_dispatch:

permissions: {}

jobs:
  translate:
    runs-on: ubuntu-latest
    if: github.repository == 'cognifyi/cogbox'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: generaltranslation/translate@7e7badcae4494bfa58c95415a933251992aedb7c # v0
        with:
          # NOTE: `api_key` (not `gt_api_key`) is the required input in this
          # pinned action version; omitting it fails with
          # "Input required and not supplied: api_key".
          api_key: ${{ secrets.GT_API_KEY }}
          gt_api_key: ${{ secrets.GT_API_KEY }}
          gt_project_id: ${{ secrets.GT_PROJECT_ID }}
          config: 'apps/docs/gt.config.json'
          inline: true
          timeout: 3600
          pr_branch: 'gt-translate/${{ github.ref_name }}'
